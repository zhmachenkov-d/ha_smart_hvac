# Epic breakdown — table order is build order.

[[entry]]
id = 1
type = "story"
title = "Directional clamp + strict apply"
description = "Add directional should_commit_omega_c (skip commit on guard trip, max+ωc↑, min+ωc↓; allow relieving moves). When commit would be blocked, do not feed proposed ωc into with_omega_c — compute_tracking uses current committed ωc. Wire in control_tick. Tests: commit matrix and Hass-free saturated upward-proposal ratchet regression."
verify = "uv run pytest: should_commit_omega_c matrix (None/tripped/max+up/max+down/min+down/min+up/interior); saturated upward proposals do not raise applied or committed ωc across ticks."
covers = ["CAP-1", "CAP-2", "CAP-6"]
after = []
hitl = false
risk = "medium"
notes = ["Tracer bullet. CAP-6 parts (a)(b)."]

[[entry]]
id = 2
type = "story"
title = "Latch decay + skip adapt"
description = "While blow-up latch is already active at tick start, skip maybe_adapt. Each tick if |u_track| > 0.8·u_track_max or u_track non-finite, step ωc down by existing tuner max_rate_fraction (≥ omega_c_min) and persist even when guard trip blocks normal commit_omega_c. Stop decay when finite |u_track| ≤ 0.8·u_track_max. Criterion is actual tick |u_track|, not |ωc·e/b0|. 0.8 is a code constant."
verify = "uv run pytest: with latch already active, maybe_adapt is not called; multi-tick |u_track| above threshold decays persisted ωc until ≤ 0.8·u_track_max; non-finite u_track also steps down."
covers = ["CAP-4", "CAP-6"]
after = [1]
hitl = false
risk = "medium"
notes = ["Least certain after tracer. CAP-6 part (e)."]

