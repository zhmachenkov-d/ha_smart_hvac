title = "Write-on-change setpoint"
description = "In _write_setpoint (demand and idle/0): if plant entity float state equals desired, skip number/set_value but return success so the tick continues. Keep fail-closed abort when entity is unavailable/unknown/unparseable. Equality baseline is entity state, not a last-written cache."
verify = "uv run pytest: identical entity float skips set_value without aborting tick side effects; unreadable entity returns false and aborts the tick."
covers = ["CAP-3", "CAP-6"]
after = [2]
hitl = false
risk = "low"
notes = ["CAP-6 parts (c)(d)."]

