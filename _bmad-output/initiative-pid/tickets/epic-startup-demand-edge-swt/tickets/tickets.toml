type = "story"
title = "Tracer: initialize first tick and demand-edge SWT write"
description = "After initialize, run one full control_tick (demand SWT write + ∫ advance when gates allow; RLS per ADR 0006 on that tick). On rising-edge into gated demand (Plant on ∧ Heating Demand, including plant-on while already demand), write demand SWT without advancing ∫ and without stepping RLS. Mid-demand zone air / setpoint stay no-op; weights-unusable on edge → write 0 + clear; timer not reset; idle / plant-off clears unchanged."
verify = "Initialize under plant-on + demand writes rounded SWT and advances ∫ once without waiting control_interval. Idle→gated-demand and plant-off→on-with-demand events write SWT with ∫ and RLS unchanged. Already-in-demand zone/setpoint events neither write nor advance ∫. Weights-unusable on edge writes 0 + clears. Idle/plant-off clears still work. uv run pytest and uv run ruff check clean."
covers = ["R1", "R2"]
after = ["epic-fixed-pid-swt", "epic-rls-pid-retune"]
hitl = false
risk = "high"
notes = ["Tracer for epic R1/R2 (parent R5/R6, D28–D30). Docs → entry 2. High risk: wrong gated-demand edge or accidental ∫/RLS step on event."]



