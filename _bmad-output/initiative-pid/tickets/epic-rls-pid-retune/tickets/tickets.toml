description = "Adds pure-Python ARX+RLS (per rls-adaptive-algorithm.md), yaml pid.adaptive default off and optional boiler-water y entity, and on control_tick demand with plant available steps RLS and applies adapted Kp/Ki to the existing clamp(base+u_pid) law; adaptive off uses yaml fixed kp/ki. In-memory RLS state only (JSON persistence is entry 3). With adaptive on and Heating Demand, commanded SWT follows the adapted gains; with adaptive off, behavior matches today's fixed PID. Weather/FF stay absent."
