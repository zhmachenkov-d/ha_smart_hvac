# epic-rls-pid-retune — story breakdown (approved 2026-11-08)

[[entry]]
id = 1
type = "story"
title = "Tracer: RLS adaptive Kp/Ki on control tick"
description = "Adds pure-Python ARX+RLS (per rls-adaptive-algorithm.md), yaml pid.adaptive default off, and top-level boiler_water as RLS y (required when adaptive on — ConfigError otherwise). On control_tick demand with plant available, steps RLS (prior demand u + prior y) and applies adapted Kp/Ki to clamp(base+u_pid); adaptive off uses yaml fixed kp/ki. In-memory RLS only (JSON = entry 3). Idle/plant-off/no-valid-zones/weights-unusable clears wipe y_prev and ∫ but keep θ/P, last demand u, and last-good adapted gains. Weather/FF stay absent. Rails/unhealthy = entry 2."
verify = "With pid.adaptive omitted/false, demand ticks keep yaml gains and never step RLS. With adaptive true and missing/empty boiler_water, parse raises ConfigError. With adaptive true, plant available, prior demand u, prior y, and finite boiler_water y, a demand tick steps RLS once and a valid IMC map drives adapted kp/ki; no step when plant unavailable or y_prev not yet seeded; clears wipe y_prev but keep θ/P, last demand u, and parked adapted gains (no RLS step on clear). Unhealthy/out-of-band → YAML fixed is entry 2 (overrides tracer last-good-on-IMC-invalid). uv run pytest and uv run ruff check clean."
covers = ["R1", "R3", "R4", "R5"]
after = ["epic-fixed-pid-swt"]
hitl = false
risk = "high"
notes = ["Tracer runtime for R1 (adapted law), R3 (tick-only step), R4 (adaptive-off → yaml fixed), R5 (flag default off). Party 2026-11-08: no air-y (B1); rails stay entry 2; clears wipe y_prev; keep θ/P, last demand u, and last-good across clear. Entry 2 overrides last-good-on-IMC-invalid with unhealthy/rails latch → YAML fixed. Docs → entry 4. JSON → entry 3."]

