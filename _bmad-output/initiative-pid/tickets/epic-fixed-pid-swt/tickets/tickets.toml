verify = "Tests show each bad commission value makes initialize log 'HVAC config error' instead of raising; args with legacy or unknown keys are reported by parse_config and logged as one WARNING naming them; the example yaml (with module and class) reports none; uv run pytest and uv run ruff check clean."
covers = []
after = [5]
hitl = false
risk = "medium"
notes = ["Source: epic-fixed-pid-swt-retrospective.md A3 and the code part of A5 (PD1, SR4); split from entry 5 by user decision 2026-11-07."]

