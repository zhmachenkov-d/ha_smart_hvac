[[entry]]
id = 5
type = "story"
title = "PID integral units and R7 skip hardening"
description = "Closes the retrospective's law and skip items: integral in °C·h (dt = control_interval/3600, ki in 1/h) with yaml I-term limits in °C of water (i_term_min/i_term_max replace integral_min/integral_max; ki = 0 holds the I-term and ∫ at 0) and C4 defaults kp 1.0, ki 1.0/h, I-term [−10, +15] °C; R7 skip only when the plant entity already reads the rounded command (last commanded SWT is no longer a skip input), and no ∫ advance while the plant entity is unavailable; apps.yaml.example and docs/house-calibration.md describe the new keys and units. Entries 7 and 6 rely on these key names."
verify = "Tests show: e = 0.2 °C for 3 ticks at 300 s gives an I-term of 0.05 °C and e = 1 °C over 12 ticks adds 1.0 °C (ki 1.0/h), with no single-tick rail; kp ≠ 1 changes u_pid; ∫ carries across two app ticks into the written SWT; the I-term reaches i_term_min; ki = 0 keeps the I-term at 0; with the plant already at a command reached off the 0.1 grid (raw 41.96 → 42.0) the call is skipped; last commanded equal but plant drifted → write; plant unavailable on equal-skip → ∫ unchanged; uv run pytest and uv run ruff check clean."
covers = ["R1", "R7"]
after = [4]
hitl = false
risk = "high"
notes = ["Source: epic-fixed-pid-swt-retrospective.md A1, A2, A4 (SR1, SR2, VG1–VG4); C4 and R7 as re-rendered 2026-11-07 (initiative D15, D22).", "Beyond criteria: the plan's Verification includes a multi-tick trace with C4 defaults under the example bounds (40–55) and the house bounds (42–60); full multi-lens code review, not review: quick (retro A9)."]

