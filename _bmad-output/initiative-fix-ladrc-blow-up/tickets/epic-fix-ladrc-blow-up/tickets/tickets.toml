title = "Blow-up guard in hvac_app"
description = "In hvac_app after compute_tracking, if u_track is non-finite or |u_track| exceeds config u_track_max (default 100): reset ESO, command=clamp(u_ff), WARNING once per episode; optionally refuse advance with non-finite state. No guard API in LadrcState. Guard regression tests on a pure testable seam (no full AppDaemon)."
verify = "Poisoned z2 or exploded u_track yields feedforward-only command, ESO reset, and WARNING path; uv run pytest covers the guard."
covers = ["CAP-2", "CAP-3"]
