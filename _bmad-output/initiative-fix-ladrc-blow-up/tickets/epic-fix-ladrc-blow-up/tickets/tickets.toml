[[entry]]
id = 1
type = "story"
title = "Continuous-form ESO in LadrcState"
description = "Replace LadrcState.advance exp_map (α=1-exp(-ωo·dt)) with continuous-form ESO (β1=2ωo, β2=ωo² over the sample; RK or equivalent). Add tests that reproduce divergence under exp_map and/or Huang-scale gains, and assert continuous-form multi-tick boundedness with thermal-band gains and tracking-residue u=(command-u_ff)."
verify = "uv run pytest: exp_map and/or Huang gains diverge over multiple advances; continuous-form ESO with b0/omega_o in thermal band and C-style known input keeps u_track/z finite with |u_track| in tens of °C over N ticks (y≈21, plant clamp 40..55)."
covers = ["CAP-5", "CAP-3"]
after = []
hitl = false
risk = "high"
plan_checkpoint = true
done_checkpoint = true
notes = ["Tracer bullet. CAP-3 part (a): divergence under old discrete map / Huang. Integrator choice free if tests pass (spec A1)."]

[[entry]]
